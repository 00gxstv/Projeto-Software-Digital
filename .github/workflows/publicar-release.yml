name: Atualizar release Digital+

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Digital-Mais-TCC.zip
      - .github/workflows/publicar-release.yml

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Verificar pacote
        run: unzip -t Digital-Mais-TCC.zip

      - name: Atualizar ZIP da release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 Digital-Mais-TCC.zip --clobber --repo "${{ github.repository }}"
          else
            gh release create v1.0.0 Digital-Mais-TCC.zip --repo "${{ github.repository }}" --target main --title "Digital+ v1.0.0 — Versão funcional" --notes "Versão funcional do sistema Digital+."
          fi
